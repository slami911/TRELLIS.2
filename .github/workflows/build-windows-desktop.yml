name: Build Windows Desktop EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop_client/**"
      - ".github/workflows/build-windows-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout desktop client
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop_client
          sparse-checkout-cone-mode: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: desktop_client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        working-directory: desktop_client
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TRELLIS2-Desktop app.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRELLIS2-Desktop-Windows
          path: desktop_client/dist/TRELLIS2-Desktop.exe
          if-no-files-found: error
          retention-days: 14
